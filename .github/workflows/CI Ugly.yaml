name: CI Ugly
on: [push, pull_request]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r app/requirements.txt


      - name: Run tests
        run: |
          python -m pytest -q

      - name: Build and push
        run: |
          docker build -f app/Dockerfile -t myapp:latest .

      - name: Deploy to production
        run: bash app/deploy.sh prod
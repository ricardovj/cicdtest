name: CI Ugly (fixed)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-ugly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image (tagged with commit SHA)
        run: docker build -t myapp:${{ github.sha }} .

  push-image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_PASS != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Skip notice (no registry secrets)
        if: env.HAS_SECRETS != 'true'
        run: echo "DOCKER_USER / DOCKER_PASS not set - skipping image push"
      - name: Log in to Docker Hub
        if: env.HAS_SECRETS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push
        if: env.HAS_SECRETS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/myapp:${{ github.sha }}

  deploy-prod:
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to production
        run: bash deploy.sh prod ${{ github.sha }}
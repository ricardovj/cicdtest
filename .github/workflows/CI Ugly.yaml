name: CI Ugly
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of the GHCR image to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-char commit SHA"; exit 1; }
          ./deploy.sh prod "$SHA"
